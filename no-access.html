<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso Negato - HyperMC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="hypermc_icon.png">
</head>
<body class="no-access-body">

    <div class="no-access-container">
        <!-- IMMAGINE A SINISTRA -->
        <div class="no-access-image">
            <img src="mat-illustration.png" alt="HyperMC Accesso Negato">
        </div>

        <!-- TESTO E BOTTONE A DESTRA -->
        <div class="no-access-content">
            <h1><span class="brand-color">Opss...</span> non ti è consentito esplorare questa zona del sito!</h1>
            
            <!-- ID "btn-back" aggiunto al bottone -->
            <a href="index.html" id="btn-back" class="btn btn-primary">
                <i class="fa-solid fa-arrow-left"></i> Torna indietro
            </a>
        </div>
    </div>

    <!-- SCRIPT PER IMPOSTARE IL RITORNO DINAMICO -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const backBtn = document.getElementById('btn-back');
            const urlParams = new URLSearchParams(window.location.search);
            const previousPage = urlParams.get('from');

            if (previousPage) {
                // Imposta il link alla pagina o sezione esatta da cui l'utente proveniva
                backBtn.href = decodeURIComponent(previousPage);
            } else if (document.referrer) {
                // Fallback nel caso sia arrivato tramite link diretto
                backBtn.href = document.referrer;
            } else {
                // Fallback predefinito se non c'è una cronologia
                backBtn.href = 'index.html';
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
